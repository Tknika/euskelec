{{- /* The dynamic tests, from the `tests` list of the competition page: {name, icon}. Context: the competition page. */ -}}
<ul class="not-prose grid grid-cols-2 gap-px border border-night-700 bg-night-700 sm:grid-cols-3 lg:grid-cols-5">
  {{ range .Params.tests }}
    <li class="flex flex-col items-center gap-4 bg-night-900 px-4 py-8 text-center">
      {{ with .icon }}<img src="{{ . | relURL }}" alt="" class="size-14 object-contain" loading="lazy">{{ end }}
      <span class="font-display text-sm font-medium text-white">{{ .name }}</span>
    </li>
  {{ end }}
</ul>
