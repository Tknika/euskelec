{{- /* Title band of inner pages: eyebrow, title and description, over the logo's bars. */ -}}
<header class="relative overflow-hidden border-b border-night-800">
  <div class="bars-bg absolute inset-y-0 right-0 hidden w-1/3 md:block [mask-image:linear-gradient(to_left,black,transparent)]" aria-hidden="true"></div>
  <div class="container-site relative py-14 sm:py-20">
    {{ with .Params.eyebrow }}<p class="eyebrow mb-5">{{ . }}</p>{{ end }}
    <h1 class="max-w-4xl text-4xl font-semibold sm:text-5xl lg:text-6xl">{{ .Title }}</h1>
    {{ with .Description }}<p class="mt-6 max-w-3xl text-lg text-night-300">{{ . }}</p>{{ end }}
  </div>
</header>
