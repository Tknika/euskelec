{{- /* Highlighted box. Usage: {{< note >}}Markdown{{< /note >}} (type="warning" for the Tknika lime variant) */ -}}
{{ $warn := eq (.Get "type") "warning" }}
<div class="border {{ if $warn }}border-tknika bg-tknika/15{{ else }}border-brand/30 bg-brand-50{{ end }} px-6 py-5">
  <div class="flex gap-4">
    <span class="font-display font-bold {{ if $warn }}text-ink{{ else }}text-brand-700{{ end }}" aria-hidden="true">{{ if $warn }}!{{ else }}i{{ end }}</span>
    <div class="text-ink [&>p]:m-0">{{ .Inner | .Page.RenderString (dict "display" "block") }}</div>
  </div>
</div>
